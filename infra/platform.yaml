AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  pmcp platform - CloudFront -> ALB (HTTPS, origin secret) -> ECS Fargate (ARM64) MCP server, one-off Fargate
  worker tasks, DynamoDB state, Cognito sign-in, public onboarding template bucket, budget alerts.

Parameters:
  ImageUri:
    Type: String
  PublicHostname:
    Type: String
    Default: mcp.m161awm.kr
  OriginHostname:
    Type: String
    Default: origin-mcp.m161awm.kr
  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 for PublicHostname.
  OriginCertificateArn:
    Type: String
    Description: ACM certificate in this region for OriginHostname.
  CloudFrontPrefixListId:
    Type: String
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region.
  AlertEmail:
    Type: String
  MonthlyBudgetUsd:
    Type: Number
    Default: 30
  CognitoDomainPrefix:
    Type: String
    Default: pmcp-auth

Resources:
  # ---------------------------------------------------------------- network (no NAT: public subnets)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: pmcp}]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw}
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw}
  RtA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable}
  RtB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable}
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: pmcp ALB - HTTPS from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: !Ref CloudFrontPrefixListId}
  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: pmcp tasks - from ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSg}

  # ---------------------------------------------------------------- secrets and state
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: pmcp/origin-verify
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: pmcp-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub pmcp-public-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
  PublicBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnboardingTemplateIsPublic
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${PublicBucket}/onboarding/*

  # ---------------------------------------------------------------- Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: pmcp-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: false}
      Policies:
        PasswordPolicy: {MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireUppercase: false,
                         RequireSymbols: false}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${CognitoDomainPrefix}-${AWS::AccountId}
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: pmcp-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${PublicHostname}/callback"]
      LogoutURLs: [!Sub "https://${PublicHostname}/", !Sub "https://${PublicHostname}/relogin"]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits: {IdToken: minutes, AccessToken: minutes}
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: admin}
  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: user}

  # ---------------------------------------------------------------- ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: pmcp
      ClusterSettings: [{Name: containerInsights, Value: disabled}]
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /pmcp/platform, RetentionInDays: 14}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pmcp-platform-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: pmcp-platform
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: State
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt StateTable.Arn
              - Sid: Secrets
                Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:CreateSecret]
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pmcp/*
              - Sid: TenantRolesOnly
                Effect: Allow
                Action: sts:AssumeRole
                Resource: arn:aws:iam::*:role/pmcp-*
              - Sid: Workers
                Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/pmcp-worker:*
                Condition: {ArnEquals: {ecs:cluster: !GetAtt Cluster.Arn}}
              - Sid: TagWorkers
                Effect: Allow
                Action: ecs:TagResource
                Resource: "*"
                Condition: {StringEquals: {ecs:CreateAction: RunTask}}
              - Sid: PassWorkerRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt ExecutionRole.Arn, !Sub "arn:aws:iam::${AWS::AccountId}:role/pmcp-platform-task"]
              - Sid: Pricing
                Effect: Allow
                Action: pricing:GetProducts
                Resource: "*"
  ServerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pmcp-server
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: pmcp
          Image: !Ref ImageUri
          Command: [pmcp, serve, --transport, http, --port, "8000"]
          PortMappings: [{ContainerPort: 8000}]
          Environment:
            - {Name: PMCP_MODE, Value: cloud}
            - {Name: PMCP_PLATFORM_REGION, Value: !Ref AWS::Region}
            - {Name: PMCP_PLATFORM_ACCOUNT_ID, Value: !Ref AWS::AccountId}
            - {Name: PMCP_STATE_TABLE, Value: !Ref StateTable}
            - {Name: PMCP_PUBLIC_BASE_URL, Value: !Sub "https://${PublicHostname}"}
            - {Name: PMCP_JWT_SECRET_ID, Value: pmcp/jwt-signing-key}
            - {Name: PMCP_ORIGIN_VERIFY_SECRET_ID, Value: !Ref OriginSecret}
            - {Name: PMCP_COGNITO_USER_POOL_ID, Value: !Ref UserPool}
            - {Name: PMCP_COGNITO_CLIENT_ID, Value: !Ref UserPoolClient}
            - {Name: PMCP_COGNITO_DOMAIN, Value: !Sub "${CognitoDomainPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"}
            - {Name: PMCP_RUNNER, Value: ecs}
            - {Name: PMCP_ECS_CLUSTER, Value: !Ref Cluster}
            - {Name: PMCP_WORKER_TASK_DEFINITION, Value: pmcp-worker}
            - {Name: PMCP_WORKER_SUBNETS, Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]}
            - {Name: PMCP_WORKER_SECURITY_GROUPS, Value: !Ref TaskSg}
            - {Name: PMCP_PLATFORM_PRINCIPAL_ARNS, Value: !Sub "arn:aws:iam::${AWS::AccountId}:role/pmcp-platform-task"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: server}
          HealthCheck:
            Command: [CMD-SHELL, "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pmcp-worker
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: pmcp
          Image: !Ref ImageUri
          Command: [pmcp, --help]
          Environment:
            - {Name: PMCP_MODE, Value: cloud}
            - {Name: PMCP_PLATFORM_REGION, Value: !Ref AWS::Region}
            - {Name: PMCP_PLATFORM_ACCOUNT_ID, Value: !Ref AWS::AccountId}
            - {Name: PMCP_STATE_TABLE, Value: !Ref StateTable}
            - {Name: PMCP_PUBLIC_BASE_URL, Value: !Sub "https://${PublicHostname}"}
            - {Name: PMCP_JWT_SECRET_ID, Value: pmcp/jwt-signing-key}
            - {Name: PMCP_ORIGIN_VERIFY_SECRET_ID, Value: !Ref OriginSecret}
            - {Name: PMCP_COGNITO_USER_POOL_ID, Value: !Ref UserPool}
            - {Name: PMCP_COGNITO_CLIENT_ID, Value: !Ref UserPoolClient}
            - {Name: PMCP_COGNITO_DOMAIN, Value: !Sub "${CognitoDomainPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"}
            - {Name: PMCP_RUNNER, Value: ecs}
            - {Name: PMCP_ECS_CLUSTER, Value: !Ref Cluster}
            - {Name: PMCP_WORKER_TASK_DEFINITION, Value: pmcp-worker}
            - {Name: PMCP_WORKER_SUBNETS, Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]}
            - {Name: PMCP_WORKER_SECURITY_GROUPS, Value: !Ref TaskSg}
            - {Name: PMCP_PLATFORM_PRINCIPAL_ARNS, Value: !Sub "arn:aws:iam::${AWS::AccountId}:role/pmcp-platform-task"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: worker}

  # ---------------------------------------------------------------- ALB
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: pmcp
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "120"}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "30"}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref OriginCertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: "403", ContentType: text/plain, MessageBody: forbidden}
  FromCloudFront:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Pmcp-Origin-Verify
            Values: [!Sub "{{resolve:secretsmanager:${OriginSecret}}}"]
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  Service:
    Type: AWS::ECS::Service
    DependsOn: FromCloudFront
    Properties:
      ServiceName: pmcp-server
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ServerTask
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers: [{ContainerName: pmcp, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup}]
  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: 1
      MaxCapacity: 3
  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: pmcp-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ---------------------------------------------------------------- CloudFront
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: pmcp
        Aliases: [!Ref PublicHostname]
        HttpVersion: http2
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: alb
            DomainName: !Ref OriginHostname
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Pmcp-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginSecret}}}"
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer

  # ---------------------------------------------------------------- cost guard
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: pmcp-platform
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 15,
                         ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 25,
                         ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 30,
                         ThresholdType: ABSOLUTE_VALUE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]

Outputs:
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
    Description: CNAME target for PublicHostname
  AlbDns:
    Value: !GetAtt Alb.DNSName
    Description: CNAME target for OriginHostname
  PlatformTaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  UserPoolId:
    Value: !Ref UserPool
  PublicBucket:
    Value: !Ref PublicBucket
  CognitoDomain:
    Value: !Sub ${CognitoDomainPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
