[project]
name = "pmcp"
version = "0.1.0"
description = "Remote MCP server that designs, deploys, verifies and operates AWS-native data pipelines in users' own AWS accounts"
readme = "README.md"
authors = [
    { name = "m161awm2", email = "kubonmo519@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "botocore[crt]>=1.43.118",
    "cfn-lint>=1.58.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "mcp[cli]>=2,<3",
    "pydantic>=2.10",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[all]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[project.scripts]
pmcp = "pmcp.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
